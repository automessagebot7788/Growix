<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GROWIX FARM</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#071009;--card:#132319;--card2:#1b3220;--green:#67dc58;
--green2:#399f42;--gold:#ffd75c;--white:#f3fff2;--muted:#8fa594;
--red:#ff7373;--blue:#63a8ff;--purple:#a989ff
}
html,body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{border:0;color:inherit;cursor:pointer}
#app{
width:100%;max-width:600px;min-height:100vh;margin:auto;padding-bottom:90px;
background:radial-gradient(circle at 50% -10%,#285b31 0,#112619 35%,#071009 78%)
}
.header{
position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;
align-items:center;padding:10px 12px;background:rgba(7,16,9,.95);
backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07)
}
.logo{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:1000;letter-spacing:1px}
.logoMark{
width:35px;height:35px;display:flex;align-items:center;justify-content:center;
border-radius:12px;background:linear-gradient(145deg,#7cea65,#2f8535)
}
.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.topStat{padding:7px 8px;border-radius:11px;background:rgba(255,255,255,.07);font-size:10px;font-weight:900}
.topStat.crystal{color:#bda6ff}.topStat.star{color:#ffd75c}
.content{padding:14px}
.page{display:none}.page.active{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

.hero{
position:relative;overflow:hidden;min-height:150px;padding:20px;margin-bottom:13px;
border-radius:27px;background:linear-gradient(135deg,#285f30,#16321d 55%,#102016);
border:1px solid rgba(255,255,255,.08)
}
.heroText{position:relative;z-index:2;max-width:76%}
.heroTitle{font-size:28px;line-height:1.05;font-weight:1000}
.heroSub{margin-top:9px;color:#bfd2c0;font-size:13px;line-height:1.45}
.heroEmoji{position:absolute;right:8px;bottom:-5px;font-size:88px;opacity:.8}

.card{
padding:15px;margin-bottom:12px;border-radius:22px;
background:linear-gradient(145deg,rgba(27,51,31,.97),rgba(14,29,18,.97));
border:1px solid rgba(255,255,255,.065)
}
.sectionTitle{
display:flex;justify-content:space-between;align-items:center;gap:8px;
margin-bottom:12px;font-size:18px;font-weight:950
}
.muted{color:var(--muted)}.small{font-size:12px}
.badge{
display:inline-block;padding:5px 9px;border-radius:10px;
background:rgba(255,255,255,.08);font-size:10px;font-weight:900
}
.btn{
width:100%;padding:12px;margin-top:8px;border-radius:14px;
background:linear-gradient(135deg,#4caf43,#327d38);font-size:13px;font-weight:950
}
.btn.gold{background:linear-gradient(135deg,#ffd84d,#bd8e2c);color:#241b05}
.btn.blue{background:linear-gradient(135deg,#427cc2,#315d95)}
.btn.red{background:linear-gradient(135deg,#a94c4c,#733333)}
.btn.purple{background:linear-gradient(135deg,#8c6be5,#6144b3)}
.btn.secondary{background:rgba(255,255,255,.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.homeTools{
display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px
}
.homeTool{
padding:11px 6px;border-radius:17px;background:linear-gradient(145deg,#203d25,#122619);
border:1px solid rgba(255,255,255,.07);font-size:11px;font-weight:900;text-align:center
}
.homeTool span{display:block;margin-bottom:4px;font-size:23px}

.farmWorld{
position:relative;overflow:hidden;min-height:500px;padding:12px;border-radius:26px;
background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.08),transparent 20%),linear-gradient(#77bb61,#69a950);
border:3px solid #315e32
}
.worldTitle{
text-align:center;position:relative;z-index:20;margin-bottom:10px;
font-weight:1000;text-shadow:0 1px 2px #0006
}
.worldCenter{position:relative;min-height:450px;width:100%}
.worldField{
position:absolute;left:50%;top:38px;transform:translateX(-50%);z-index:4;width:70%;
display:grid;gap:4px;padding:7px;border-radius:20px;background:#74462b;
border:5px solid #4f2d1c;transition:.25s;overflow:hidden
}
.worldPlot{
min-width:0;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
border-radius:8px;background:linear-gradient(145deg,#97613b,#6e4027);
font-size:clamp(15px,4.8vw,28px);cursor:pointer;position:relative
}
.worldPlot.ready{
animation:bob .8s infinite alternate;box-shadow:0 0 15px #67dc5866
}
.worldPlot.crow{background:linear-gradient(145deg,#4b392d,#34251d)}
@keyframes bob{to{transform:translateY(-3px)}}
.perimeter{
position:absolute;inset:18px 4px 4px;z-index:10;pointer-events:none
}
.perimeterSlot{
position:absolute;width:34px;height:34px;border-radius:11px;
background:rgba(71,48,27,.72);border:2px dashed rgba(255,255,255,.4);
display:flex;align-items:center;justify-content:center;font-size:19px;
pointer-events:auto;box-shadow:0 2px 5px #0003
}
.perimeterSlot.empty:hover{background:rgba(81,128,67,.9)}
.perimeterSlot.built{border-style:solid;background:rgba(34,65,37,.94)}
.slotTop{top:0}.slotBottom{bottom:0}.slotLeft{left:0}.slotRight{right:0}
.guard{
position:absolute;z-index:14;font-size:25px;transition:.8s;
filter:drop-shadow(0 2px 2px #0008);pointer-events:none
}
.npc{
position:absolute;z-index:6;font-size:27px;
animation:walk 8s ease-in-out infinite alternate
}
.worldPlotTimer{
position:absolute;left:3px;right:3px;bottom:3px;padding:3px 2px;border-radius:6px;
background:#000b;color:#fff;font-size:7px;font-weight:1000;text-align:center;
white-space:nowrap
}

.battleScene{
position:relative;height:150px;margin:10px 0;border-radius:18px;overflow:hidden;
background:linear-gradient(180deg,#6b9b5a,#42663d);border:2px solid #29452b
}
.battleGround{
position:absolute;inset:0;
background:repeating-linear-gradient(90deg,transparent 0 32px,#ffffff08 33px 34px)
}
.battleUnit{
position:absolute;font-size:30px;z-index:3;
transition:left .55s ease,top .55s ease,transform .35s ease;
filter:drop-shadow(0 2px 2px #0008)
}
.battleUnit.fight{animation:unitFight .55s ease}
.battleUnit.hit{animation:unitHit .38s ease}
.battleSlash{
position:absolute;z-index:5;font-size:24px;
animation:slash .45s ease forwards;pointer-events:none
}
.battleHp{
position:absolute;top:-7px;left:50%;transform:translateX(-50%);
width:42px;height:6px;border-radius:8px;background:#241010;overflow:hidden
}
.battleHpFill{height:100%;background:#67dc58;transition:.2s}
.battleDamage{
position:absolute;z-index:20;font-size:12px;font-weight:1000;color:#ff7373;
animation:damageFloat .7s ease forwards;pointer-events:none
}
.battleResult{
position:absolute;inset:0;z-index:50;display:flex;align-items:center;
justify-content:center;flex-direction:column;background:rgba(0,0,0,.68);
backdrop-filter:blur(3px)
}
.battleResultTitle{font-size:36px;font-weight:1000;text-shadow:0 3px 12px #000}
.battleResultSub{margin-top:7px;font-size:13px;color:#dcebdd}
.battleEmpty{text-align:center;padding:45px 20px;color:#c8d9c9;font-weight:800}

@keyframes unitFight{
0%{transform:translateX(0) scale(1)}
45%{transform:translateX(13px) scale(1.15)}
100%{transform:translateX(0) scale(1)}
}
@keyframes unitHit{
0%{opacity:1;transform:translateX(0)}
50%{opacity:.55;transform:translateX(-8px)}
100%{opacity:1;transform:translateX(0)}
}
@keyframes slash{
0%{opacity:0;transform:scale(.4) rotate(-20deg)}
30%{opacity:1}
100%{opacity:0;transform:scale(1.3) rotate(20deg) translateY(-12px)}
}
@keyframes damageFloat{
0%{opacity:1;transform:translateY(0) scale(1)}
100%{opacity:0;transform:translateY(-25px) scale(1.15)}
}
@keyframes walk{
0%{transform:translate(0,0)}
25%{transform:translate(25px,10px)}
50%{transform:translate(-10px,35px)}
75%{transform:translate(30px,55px)}
100%{transform:translate(0,20px)}
}

.field{
display:grid;grid-template-columns:repeat(3,1fr);gap:9px
}
.plot{
position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
border-radius:17px;background:linear-gradient(145deg,#81502f,#61371f);
border:3px solid #4c2b1b;font-size:35px;overflow:hidden;cursor:pointer
}
.plot.empty:after{content:"＋";opacity:.5}
.plot.ready{animation:bob .8s infinite alternate}
.plot.crow{background:linear-gradient(145deg,#4c3a2f,#33271f)}
.plotTimer{
position:absolute;bottom:5px;left:5px;right:5px;padding:4px;border-radius:8px;
background:#000a;text-align:center;font-size:9px;font-weight:900
}
.plotLabel{
position:absolute;top:5px;left:5px;padding:3px 5px;border-radius:7px;
background:#0007;font-size:8px
}
.progress{
width:100%;height:9px;margin-top:8px;overflow:hidden;border-radius:20px;
background:rgba(255,255,255,.07)
}
.progressFill{
height:100%;border-radius:20px;
background:linear-gradient(90deg,#3d9f3b,#7ce969);transition:.3s
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.itemCard{
padding:13px;border-radius:18px;background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.05);text-align:center
}
.itemImage{
width:65px;height:65px;margin:auto;display:flex;align-items:center;
justify-content:center;border-radius:20px;background:rgba(255,255,255,.04);font-size:40px
}
.itemName{margin-top:7px;font-size:14px;font-weight:900}
.itemCount{margin-top:3px;color:var(--muted);font-size:11px}
.row{
display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;
margin-bottom:7px;border-radius:16px;background:rgba(255,255,255,.045)
}
.rowLeft{display:flex;align-items:center;gap:10px}
.rowIcon{
width:42px;height:42px;display:flex;align-items:center;justify-content:center;
border-radius:13px;background:rgba(255,255,255,.06);font-size:23px;flex-shrink:0
}
.rowName{font-size:13px;font-weight:900}
.rowSub{margin-top:3px;color:var(--muted);font-size:10px}
.price{color:var(--gold);font-size:12px;font-weight:950}
.profileStats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.profileStat{
padding:13px;border-radius:15px;background:rgba(255,255,255,.05);text-align:center
}
.profileStat b{display:block;font-size:20px}.profileStat span{color:var(--muted);font-size:10px}
.package{
padding:15px;margin-bottom:9px;border-radius:20px;
background:linear-gradient(145deg,#263f29,#142519);
border:1px solid rgba(255,255,255,.07)
}
.packageTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:950}
.packageItems{margin-top:8px;color:#bdd0bd;font-size:11px;line-height:1.6}
.input{
width:100%;padding:13px;border:1px solid rgba(255,255,255,.08);
border-radius:14px;outline:none;background:#09140c;color:white
}
.center{text-align:center}
.cooldownBox{
padding:10px;border-radius:12px;background:rgba(255,255,255,.05);
text-align:center;font-size:11px;color:#bdd0bd
}

.modal{
position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);
display:none;align-items:center;justify-content:center;padding:15px
}
.modal.show{display:flex}
.modalBox{
width:100%;max-width:560px;max-height:90vh;overflow:auto;
border-radius:25px;background:#102016;border:1px solid rgba(255,255,255,.1);
padding:16px;box-shadow:0 15px 60px #0009
}
.modalClose{
float:right;width:34px;height:34px;border-radius:11px;
background:rgba(255,255,255,.08);font-size:18px
}
.battleFullscreen{
padding:0;align-items:stretch;justify-content:stretch;background:#071009
}
.battleFullscreen .modalBox{
max-width:none;width:100%;height:100%;max-height:none;border-radius:0;
padding:12px;background:linear-gradient(180deg,#142719,#071009);
border:0
}
.battleArena{
position:relative;min-height:calc(100vh - 90px);overflow:hidden;border-radius:22px;
background:
radial-gradient(circle at 20% 30%,#ffffff10,transparent 15%),
linear-gradient(180deg,#5c8f50 0%,#3f6639 58%,#31502e 100%);
border:3px solid #29452b
}
.battleArena:before{
content:"";position:absolute;inset:0;opacity:.35;
background:repeating-linear-gradient(0deg,transparent 0 39px,#ffffff08 40px 41px)
}
.battleSide{
position:absolute;top:10px;padding:8px 11px;border-radius:12px;
background:#0008;z-index:20;font-size:11px;font-weight:1000
}
.battleSide.left{left:10px}.battleSide.right{right:10px}
.battleCenter{
position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
z-index:15;font-size:30px;font-weight:1000;text-shadow:0 2px 7px #000
}
.battleBottom{
position:absolute;left:10px;right:10px;bottom:10px;z-index:30;
padding:12px;border-radius:18px;background:#071009dd;backdrop-filter:blur(7px)
}
.battleBottomTitle{text-align:center;font-size:14px;font-weight:1000}
.battleBottomSub{text-align:center;margin-top:4px;color:#bcd0bd;font-size:10px}
.battleLog{
max-height:80px;overflow:auto;margin-top:7px;font-size:9px;color:#c9dcc9;
text-align:center
}
.nav{
position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:60;
width:100%;max-width:600px;padding:7px 8px 9px;
display:grid;grid-template-columns:repeat(6,1fr);gap:5px;
background:rgba(7,16,9,.96);backdrop-filter:blur(18px);
border-top:1px solid rgba(255,255,255,.08)
}
.navBtn{
padding:7px 2px;border-radius:13px;background:transparent;
font-size:9px;font-weight:900;color:#78907d
}
.navBtn span{display:block;font-size:19px;margin-bottom:2px}
.navBtn.active{background:rgba(103,220,88,.12);color:#8ef57e}

.toast{
position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(20px);
z-index:200;padding:12px 16px;border-radius:15px;background:#16281b;
border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 30px #0008;
font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;
max-width:90%;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<body>
<div id="app">

<header class="header">
<div class="logo">
<div class="logoMark">🌱</div>
GROWIX
</div>
<div class="stats">
<div class="topStat">🪙 <span id="coins">0</span></div>
<div class="topStat crystal">💎 <span id="crystals">0</span></div>
<div class="topStat star">⭐ <span id="stars">0</span></div>
<div class="topStat">Lv.<span id="level">1</span></div>
</div>
</header>

<main class="content">

<!-- ГЛАВНАЯ -->
<section id="page-home" class="page active">

<div class="hero">
<div class="heroText">
<div class="heroTitle">Периметр в порядке</div>
<div class="heroSub">
Развивай ферму, выращивай растения, собирай продукцию,
тренируй армию и защищай свои ресурсы
</div>
</div>
<div class="heroEmoji">🌾</div>
</div>

<div class="homeTools">
<button class="homeTool" onclick="openTasksModal()">
<span>🎯</span>Задания
</button>
<button class="homeTool" onclick="openBattleFromHome()">
<span>⚔️</span>Бой
</button>
<button class="homeTool" onclick="navigate('farm')">
<span>🌱</span>Ферма
</button>
</div>

<div id="homeBattleStatus"></div>

<div class="farmWorld">
<div class="worldTitle">🌲 ТЕРРИТОРИЯ GROWIX</div>
<div class="worldCenter" id="worldCenter">
<div id="forestEdge" class="forestEdge"></div>
<div id="worldField" class="worldField"></div>
<div id="perimeter" class="perimeter"></div>
</div>
</div>

</section>

<!-- ФЕРМА -->
<section id="page-farm" class="page">

<div class="sectionTitle">
<span>🌱 Моя ферма</span>
<span class="badge" id="farmCount">0/54</span>
</div>

<div class="card">
<div class="sectionTitle">
<span>🌾 Грядки</span>
<span class="muted small">Нажми на пустую грядку</span>
</div>
<div id="field" class="field"></div>
</div>

<div class="card">
<div class="sectionTitle">
<span>🌿 Живая ферма</span>
<span class="badge">БЕЗ ТАЙМЕРОВ</span>
</div>
<div id="livingFarm"></div>
</div>

</section>

<!-- ЖИВОТНЫЕ -->
<section id="page-animals" class="page">
<div class="sectionTitle">🐄 Мои животные</div>
<div id="animalsList"></div>
</section>

<!-- МИНИ-ИГРЫ -->
<section id="page-games" class="page">
<div class="sectionTitle">🎮 Мини-игры</div>
<div id="gamesList"></div>
</section>

<!-- МАГАЗИН -->
<section id="page-shop" class="page">
<div class="sectionTitle">🛒 Магазин</div>
<div id="shopList"></div>
</section>

<!-- ПРОФИЛЬ -->
<section id="page-profile" class="page">
<div class="sectionTitle">👤 Профиль</div>
<div id="profile"></div>
</section>

</main>

<!-- НИЖНЯЯ НАВИГАЦИЯ: РОВНО 6 РАЗДЕЛОВ -->
<nav class="nav">
<button class="navBtn active" onclick="navigate('home',this)">
<span>🏠</span>Главная
</button>
<button class="navBtn" onclick="navigate('farm',this)">
<span>🌾</span>Ферма
</button>
<button class="navBtn" onclick="navigate('animals',this)">
<span>🐄</span>Животные
</button>
<button class="navBtn" onclick="navigate('games',this)">
<span>🎮</span>Игры
</button>
<button class="navBtn" onclick="navigate('shop',this)">
<span>🛒</span>Магазин
</button>
<button class="navBtn" onclick="navigate('profile',this)">
<span>👤</span>Профиль
</button>
</nav>

</div>

<!-- ОБЩЕЕ МОДАЛЬНОЕ ОКНО -->
<div id="modal" class="modal">
<div class="modalBox">
<button class="modalClose" onclick="closeModal()">✕</button>
<div id="modalContent"></div>
</div>
</div>

<div id="toast" class="toast"></div>

/* =========================================================
   HELPERS
   ========================================================= */

function deepClone(obj){
return JSON.parse(JSON.stringify(obj));
}

function mergeState(base,loaded){
const out=deepClone(base);

function merge(a,b){
Object.keys(b||{}).forEach(k=>{
if(
b[k] &&
typeof b[k]==="object" &&
!Array.isArray(b[k]) &&
a[k] &&
typeof a[k]==="object" &&
!Array.isArray(a[k])
){
merge(a[k],b[k]);
}else{
a[k]=b[k];
}
});
}

merge(out,loaded||{});
return out;
}

function loadState(){
try{
const raw=localStorage.getItem(SAVE_KEY);
if(!raw)return deepClone(defaultState);
return mergeState(defaultState,JSON.parse(raw));
}catch(e){
console.error(e);
return deepClone(defaultState);
}
}

function save(){
try{
localStorage.setItem(SAVE_KEY,JSON.stringify(state));
}catch(e){}
}

function money(n){
return Math.floor(Number(n)||0).toLocaleString("ru-RU");
}

function formatTime(ms){
ms=Math.max(0,Math.floor(ms/1000));
const m=Math.floor(ms/60);
const s=ms%60;
return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function notify(text){
const t=document.getElementById("toast");
if(!t)return;
t.textContent=text;
t.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove("show"),2400);
}

function xpNeed(){
return 100+(state.level-1)*75;
}

function addXP(n){
state.xp+=n;
while(state.xp>=xpNeed()){
state.xp-=xpNeed();
state.level++;
notify("⭐ Новый уровень: "+state.level);
}
}

function crystalText(n){
return money(n);
}

function armyPower(){
return Object.entries(state.army).reduce((sum,[id,count])=>{
return sum+(ARMORY[id]?.power||0)*count;
},0);
}

function armyCount(){
return Object.values(state.army).reduce((a,b)=>a+b,0);
}

function random(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

/* =========================================================
   TASKS
   ========================================================= */

function taskProgress(id){
switch(id){
case"harvest":return state.tasks.harvest;
case"animals":return state.tasks.animals;
case"army":return armyPower();
case"coins":return state.tasks.coins;
case"games":return state.tasks.games;
case"raids":return state.tasks.raids;
default:return 0;
}
}

function addTaskProgress(id,n=1){
if(typeof state.tasks[id]!=="number")state.tasks[id]=0;
state.tasks[id]+=n;
}

function claimTask(id){
const d=TASK_DEFS[id];
if(!d)return;

const progress=Math.min(taskProgress(id),d.goal);

if(state.tasks.claimed[id]){
notify("ℹ️ Это задание уже получено");
return;
}

if(progress<d.goal){
notify("⏳ Задание ещё не выполнено");
return;
}

state.coins+=d.reward;
state.tasks.claimed[id]=true;
addXP(20);
save();
render();
notify("🎯 Получено +"+money(d.reward)+" 🪙");
}

function claimChannelTask(){
if(state.tasks.channel){
notify("ℹ️ Задание уже получено");
return;
}

state.tasks.channel=true;
state.coins+=1000;
addXP(15);
save();
render();
notify("📢 Партнёрское задание выполнено +1 000 🪙");
}

let gameCooldowns={};

function gameReady(id){
return !gameCooldowns[id]||Date.now()>=gameCooldowns[id];
}

function playGame(id){
if(!gameReady(id)){
notify("⏳ КД: "+formatTime(gameCooldowns[id]-Date.now()));
return;
}

gameCooldowns[id]=Date.now()+30000;

const win=Math.random()<.65;
const reward=win?random(200,600):50;

state.coins+=reward;
addTaskProgress("games",1);
addTaskProgress("coins",reward);
addXP(5);

save();
render();

notify(win?"🎯 Попадание! +"+reward+" 🪙":"🎯 Мимо, но ты получил "+reward+" 🪙");
}

function playGuess(){
if(!gameReady("guess")){
notify("⏳ КД: "+formatTime(gameCooldowns.guess-Date.now()));
return;
}

const answer=random(1,3);
const guess=Number(prompt("Угадай число от 1 до 3"));

gameCooldowns.guess=Date.now()+45000;

if(guess===answer){
state.coins+=700;
addXP(10);
notify("🎉 Угадал! +700 🪙");
}else{
state.coins+=100;
notify("❌ Не угадал. Было число "+answer);
}

addTaskProgress("games",1);
save();
render();
}

function trainingGame(){
if(!gameReady("training")){
notify("⏳ КД: "+formatTime(gameCooldowns.training-Date.now()));
return;
}

if(armyCount()<=0){
notify("❌ Сначала найми бойцов");
return;
}

gameCooldowns.training=Date.now()+60000;

state.crystals+=random(1,3);
addTaskProgress("games",1);
addXP(10);

save();
render();

notify("⚔️ Армия потренировалась");
}

function processFarmManager(){
if(!state.manager.active)return;

let changed=false;

/* Автосбор */
state.plants.forEach((plant,index)=>{
if(!plant)return;

if(Date.now()>=plant.readyAt){
const p=PLANTS[plant.type];
const amount=random(1,3);

state.coins+=p.sell*amount;
state.inventory[plant.type]=(state.inventory[plant.type]||0)+amount;

addTaskProgress("harvest",amount);
addTaskProgress("coins",p.sell*amount);

state.plants[index]=null;
changed=true;
}
});

/* Автопосадка */
for(let i=0;i<state.plots;i++){
if(!state.plants[i]){
const available=Object.entries(PLANTS).find(([id,p])=>state.coins>=p.cost);

if(!available)break;

const [id,p]=available;

state.coins-=p.cost;

state.plants[i]={
type:id,
plantedAt:Date.now(),
readyAt:Date.now()+p.time,
ready:false
};

changed=true;
}
}

if(changed)save();
}

function startMarauderBattle(){
if(activeBattleTimer){
notify("⚔️ Бой уже идёт");
return;
}

const total=armyCount();

if(total<=0){
notify("❌ У тебя нет бойцов");
return;
}

const playerUnits=[];

Object.entries(state.army).forEach(([id,count])=>{
const unit=ARMORY[id];

for(let i=0;i<count;i++){
playerUnits.push({
id,
name:unit.name,
icon:unit.icon,
maxHp:unit.hp,
hp:unit.hp,
damage:unit.damage
});
}
});

/* Ограничиваем визуальный бой, но реальные потери рассчитываются по армии */
const visualPlayer=playerUnits.slice(0,8);

const marauderCount=Math.min(8,Math.max(3,Math.ceil(total/2)));

const enemyUnits=[];

for(let i=0;i<marauderCount;i++){
enemyUnits.push({
id:"marauder"+i,
name:"Мародёр",
icon:"🥷",
maxHp:random(80,130),
hp:random(80,130),
damage:random(10,22)
});
}

battleState={
type:"marauders",
player:playerUnits,
enemy:enemyUnits,
visualPlayer,
visualEnemy:enemyUnits,
log:[],
started:Date.now(),
ended:false,
winner:null,
turn:0
};

showBattleScreen();
runBattleLoop();
}

function renderBattleUnits(){
const container=document.getElementById("battleUnits");
if(!container||!battleState)return;

let html="";

battleState.visualPlayer.forEach((u,i)=>{
if(u.hp<=0)return;

const x=8+(i%4)*10;
const y=25+Math.floor(i/4)*25;

const hp=Math.max(0,u.hp/u.maxHp*100);

html+=`
<div
class="battleUnit"
id="playerUnit${i}"
style="left:${x}%;top:${y}%"
>
<div class="battleHp">
<div class="battleHpFill" style="width:${hp}%"></div>
</div>
${u.icon}
</div>
`;
});

battleState.visualEnemy.forEach((u,i)=>{
if(u.hp<=0)return;

const x=62+(i%4)*8;
const y=28+Math.floor(i/4)*23;

const hp=Math.max(0,u.hp/u.maxHp*100);

html+=`
<div
class="battleUnit"
id="enemyUnit${i}"
style="left:${x}%;top:${y}%"
>
<div class="battleHp">
<div class="battleHpFill" style="width:${hp}%"></div>
</div>
${u.icon}
</div>
`;
});

container.innerHTML=html;
}

function totalHp(units){
return units.reduce((s,u)=>s+Math.max(0,u.hp),0);
}

function updateBattleBars(){
if(!battleState)return;

const p=document.getElementById("playerBattleHp");
const e=document.getElementById("enemyBattleHp");

if(p)p.textContent="HP: "+money(totalHp(battleState.player));
if(e)e.textContent="HP: "+money(totalHp(battleState.enemy));
}

function battleLog(text){
if(!battleState)return;

battleState.log.push(text);
if(battleState.log.length>8)battleState.log.shift();

const el=document.getElementById("battleLog");
if(el)el.innerHTML=battleState.log.slice().reverse().map(x=>"<div>"+x+"</div>").join("");
}

function showDamage(targetUnitId,damage){
const arena=document.getElementById("battleArena");
if(!arena)return;

const el=document.createElement("div");
el.className="battleDamage";
el.textContent="-"+damage;

const target=document.getElementById(targetUnitId);

if(target){
const r=target.getBoundingClientRect();
const a=arena.getBoundingClientRect();

el.style.left=(r.left-a.left+5)+"px";
el.style.top=(r.top-a.top-5)+"px";
}else{
el.style.left="50%";
el.style.top="45%";
}

arena.appendChild(el);

setTimeout(()=>el.remove(),750);
}

function showSlash(targetUnitId){
const arena=document.getElementById("battleArena");
const target=document.getElementById(targetUnitId);

if(!arena||!target)return;

const slash=document.createElement("div");
slash.className="battleSlash";
slash.textContent="⚡";

const r=target.getBoundingClientRect();
const a=arena.getBoundingClientRect();

slash.style.left=(r.left-a.left)+"px";
slash.style.top=(r.top-a.top)+"px";

arena.appendChild(slash);
setTimeout(()=>slash.remove(),500);
}

function performAttack(attacker,target,targetElementId){
if(attacker.hp<=0||target.hp<=0)return 0;

const damage=random(
Math.max(1,Math.floor(attacker.damage*.65)),
Math.max(1,Math.floor(attacker.damage*1.25))
);

target.hp=Math.max(0,target.hp-damage);

showSlash(targetElementId);
showDamage(targetElementId,damage);

const el=document.getElementById(targetElementId);
if(el){
el.classList.remove("fight","hit");
void el.offsetWidth;
el.classList.add("hit");
}

return damage;
}

function battleTick(){
if(!battleState||battleState.ended)return;

battleState.turn++;

/* выбираем живого игрока */
const alivePlayers=battleState.player.filter(u=>u.hp>0);
const aliveEnemies=battleState.enemy.filter(u=>u.hp>0);

if(!alivePlayers.length){
endBattle("enemy");
return;
}

if(!aliveEnemies.length){
endBattle("player");
return;
}

/* Игроки атакуют */
alivePlayers.slice(0,Math.min(5,alivePlayers.length)).forEach((attacker,i)=>{
const targets=battleState.enemy.filter(u=>u.hp>0);
if(!targets.length)return;

const target=targets[i%targets.length];

const visualIndex=battleState.visualEnemy.indexOf(target);
const targetEl="enemyUnit"+visualIndex;

const damage=performAttack(attacker,target,targetEl);

if(damage){
battleLog(attacker.icon+" нанёс "+damage+" урона");
}
});

/* Враги отвечают */
setTimeout(()=>{
if(!battleState||battleState.ended)return;

const aliveP=battleState.player.filter(u=>u.hp>0);
const aliveE=battleState.enemy.filter(u=>u.hp>0);

if(!aliveP.length){
endBattle("enemy");
return;
}

if(!aliveE.length){
endBattle("player");
return;
}

aliveE.slice(0,Math.min(5,aliveE.length)).forEach((attacker,i)=>{
const targets=battleState.player.filter(u=>u.hp>0);
if(!targets.length)return;

const target=targets[i%targets.length];

const visualIndex=battleState.visualPlayer.indexOf(target);
const targetEl="playerUnit"+visualIndex;

const damage=performAttack(attacker,target,targetEl);

if(damage){
battleLog("🥷 Мародёр нанёс "+damage+" урона");
}
});

renderBattleUnits();
updateBattleBars();

const pHp=totalHp(battleState.player);
const eHp=totalHp(battleState.enemy);

if(pHp<=0){
endBattle("enemy");
}else if(eHp<=0){
endBattle("player");
}
},450);

renderBattleUnits();
updateBattleBars();

if(battleState.turn>=30){
endBattle(totalHp(battleState.player)>=totalHp(battleState.enemy)?"player":"enemy");
}
}

function runBattleLoop(){
clearInterval(activeBattleTimer);

activeBattleTimer=setInterval(()=>{
if(!battleState||battleState.ended){
clearInterval(activeBattleTimer);
activeBattleTimer=null;
return;
}

battleTick();
},1000);
}

function endBattle(winner){
if(!battleState||battleState.ended)return;

battleState.ended=true;
battleState.winner=winner;

clearInterval(activeBattleTimer);
activeBattleTimer=null;

const victory=winner==="player";

if(victory){

state.raid.wins++;
state.raid.next=Date.now()+60000;

addTaskProgress("raids",1);

const reward=random(1200,3000);
state.coins+=reward;
addTaskProgress("coins",reward);
addXP(25);

battleLog("🏆 Мародёры разбиты!");

}else{

state.raid.losses++;
state.raid.next=Date.now()+90000;

/* Потери армии пропорциональны потерям HP */
const hpPlayer=totalHp(battleState.player);
const maxPlayer=battleState.player.reduce((s,u)=>s+u.maxHp,0);

const ratio=maxPlayer>0?hpPlayer/maxPlayer:0;

const lossPercent=ratio<.25?.30:ratio<.5?.20:ratio<.75?.10:0;

if(lossPercent>0){
Object.keys(state.army).forEach(id=>{
const count=state.army[id]||0;
const lost=Math.min(count,Math.floor(count*lossPercent));
state.army[id]-=lost;
});
}

addXP(8);
battleLog("💀 Мародёры прорвались");
}

save();

const arena=document.getElementById("battleArena");

if(arena){

const result=document.createElement("div");
result.className="battleResult";

result.innerHTML=`
<div class="battleResultTitle">
${victory?"🏆 ПОБЕДА":"💀 ПОРАЖЕНИЕ"}
</div>

<div class="battleResultSub">
${victory
?"Мародёры уничтожены · награда получена"
:"Армия проиграла · часть бойцов потеряна"}
</div>

${victory?`
<div class="battleResultSub" style="margin-top:10px">
🪙 Награда: +${money(state.coins?0:0)}
</div>
`:""}

<button
class="btn ${victory?"gold":"red"}"
style="max-width:300px;margin-top:18px"
onclick="closeModal();render()"
>
Продолжить
</button>
`;

arena.appendChild(result);
}

render();
}

function renderWorld(){
const field=document.getElementById("worldField");
const perimeter=document.getElementById("perimeter");
if(!field||!perimeter)return;

const cols=state.plots<=18?3:state.plots<=36?6:9;

field.style.gridTemplateColumns=`repeat(${cols},1fr)`;

let html="";

for(let i=0;i<state.plots;i++){
const p=state.plants[i];

if(!p){
html+=`<div class="worldPlot">🟫</div>`;
}else if(Date.now()>=p.readyAt){
html+=`
<div class="worldPlot ready" onclick="harvestPlot(${i})">
${PLANTS[p.type].icon}
</div>
`;
}else{
html+=`
<div class="worldPlot">
${PLANTS[p.type].icon}
<div class="worldPlotTimer">
${formatTime(p.readyAt-Date.now())}
</div>
</div>
`;
}
}

field.innerHTML=html;

let perimeterHtml="";

const totalSlots=12;

for(let i=0;i<totalSlots;i++){

let cls="perimeterSlot empty";
let icon="＋";
let type="";

if(i<state.perimeter.fences){
cls="perimeterSlot built";
icon="🪵";
type="fence";
}else if(i<state.perimeter.scarecrows){
cls="perimeterSlot built";
icon="🎃";
type="scare";
}

const pos=i<3?"slotTop":i<6?"slotRight":i<9?"slotBottom":"slotLeft";

const offset=(i%3)*38+5;

perimeterHtml+=`
<div
class="${cls} ${pos}"
style="${pos==="slotTop"||pos==="slotBottom"?"left:"+offset+"px":"top:"+offset+"px"}"
onclick="perimeterClick(${i})"
>
${icon}
</div>
`;
}

perimeter.innerHTML=perimeterHtml;
}

function perimeterClick(index){
if(index<state.perimeter.fences){
notify("🪵 Забор защищает территорию");
return;
}

if(index<state.perimeter.fences+state.perimeter.scarecrows){
notify("🎃 Чучело отпугивает воронов");
return;
}

notify("🛡️ Свободное место периметра");
}

function referralCode(){
return "GW"+String(Math.abs(hashCode(location.pathname))).slice(0,6);

function hashCode(str){
let h=0;
for(let i=0;i<str.length;i++){
h=((h<<5)-h)+str.charCodeAt(i);
h|=0;
}
return h;
}
